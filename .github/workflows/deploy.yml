name: Deploy ConsentChain

on:
  push:
    branches: [main]

env:
  ECR_REGISTRY: 620249894783.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO: consentchain-app
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      # ── Backend ──────────────────────────────────────
      - name: Build & Push Backend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:backend ./server
          docker push $ECR_REGISTRY/$ECR_REPO:backend

      # ── Frontend ─────────────────────────────────────
      - name: Build & Push Frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t $ECR_REGISTRY/$ECR_REPO:frontend \
            ./consentchain-frontend
          docker push $ECR_REGISTRY/$ECR_REPO:frontend

      # ── S3 Frontend Deploy ────────────────────────────
      - name: Build Vite for S3
        run: |
          cd consentchain-frontend
          npm ci
          VITE_API_URL=${{ secrets.VITE_API_URL }} npm run build

      - name: Upload to S3
        run: |
          aws s3 sync consentchain-frontend/dist/ \
            s3://consentchain-frontend-620249894783/ \
            --delete --sse AES256

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3V0O3F03JE9AF \
            --paths "/*"

      # ── Deploy to EC2 ─────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin \
              620249894783.dkr.ecr.ap-south-1.amazonaws.com
            cd ~/Cloud-Chain
            docker-compose pull
            docker-compose up -d
            docker image prune -f